# md-player mpv 基准配置 v1
# 每一项都有存在理由；改动必须在 docs/DECISIONS.md 记一条。
# seek 手感的另一半在代码里：拖动 keyframes / 松手 exact（CLAUDE.md 深坑 #2）。

# ---- 嵌入模式 ----
idle=yes
keep-open=yes
input-default-bindings=no
input-vo-keyboard=no
osc=no
osd-level=0

# ---- 解码 ----
hwdec=auto-safe
# macOS -> videotoolbox；Windows -> d3d11va。失败自动回软解。

# ---- 缓存与 seek 手感 ----
cache=yes
demuxer-max-bytes=768MiB
demuxer-max-back-bytes=512MiB
demuxer-readahead-secs=90
hr-seek-framedrop=yes
# hr-seek 保持默认，由播放器按拖动状态用 seek flag 控制精确/快速。
# 大回退缓存让"往回拖"命中内存，这是高码率 m2ts 丝滑的关键。

# ---- 音频 ----
audio-channels=auto-safe
volume-max=130
gapless-audio=yes
# 独占与直通由设置页动态下发，不写死：
#   audio-exclusive=yes
#   audio-spdif=ac3,eac3,dts-hd,truehd

# ---- 截图 ----
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-tag-colorspace=yes

# ---- 字幕 ----
sub-auto=fuzzy

# ---- 日志 ----
msg-level=all=warn
