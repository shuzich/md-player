name: macOS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (macOS / Qt6 / Ninja)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # 只装构建工具与 libmpv 的编译期依赖。
      # 注意：不装 Homebrew 的 mpv / libdvdread —— 前者缺 dvdnav，后者硬链 libdvdcss
      # （docs/DECISIONS.md D-009 / D-011 / D-012）。播放栈一律来自 build-deps.sh。
      - name: Install build tools
        run: |
          brew update
          brew install qt cmake ninja meson pkg-config libbluray ffmpeg libass libplacebo

      # 缓存自编译产物。key 含 build-deps.sh 内容 hash：脚本里的钉定 SHA 一变，
      # key 就变，缓存自然失效并重建；否则命中缓存，build-deps.sh 靠戳记直接跳过。
      - name: Cache self-built deps
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: third_party/prefix
          key: deps-macos-14-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Build pinned deps (libdvdread / libdvdnav / libmpv)
        run: ./scripts/build-deps.sh

      # T1 验收证据：CI 链接的 libmpv 必须与本机同源，判据是 dvd:// 出现在探测输出中。
      - name: Verify capabilities (dvd:// 必须可用)
        run: |
          export PATH="$PWD/third_party/prefix/bin:$PATH"
          export PKG_CONFIG_PATH="$PWD/third_party/prefix/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./scripts/check-mpv-caps.sh | tee caps.txt
          grep -q '^\[OK\]   dvd://' caps.txt \
            || { echo "::error::CI 的 libmpv 缺少 dvd://，与本机不同源"; exit 1; }
          grep -q '^\[OK\]   bd://'  caps.txt \
            || { echo "::error::CI 的 libmpv 缺少 bd://"; exit 1; }
          echo "缓存命中: ${{ steps.deps-cache.outputs.cache-hit || 'false' }}"

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$PWD/third_party/prefix/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      # 校验最终产物确实链到自编译 libmpv，且闭包内无解密库（铁律 #2 / D-012）。
      - name: Verify linkage
        run: |
          otool -L build/md-player | grep -q 'third_party/prefix/lib/libmpv' \
            || { echo "::error::md-player 未链接到自编译 libmpv"; otool -L build/md-player; exit 1; }
          if otool -L build/md-player | grep -qiE 'dvdcss|aacs|bdplus'; then
            echo "::error::产物依赖中出现解密库"; otool -L build/md-player; exit 1
          fi
          echo "✓ 链接自编译 libmpv，且无解密库"
          ls -l build/md-player

      # SACD helper 的冒烟：用自造骨架跑通协议 v1 的 open/stat/read，外加确定性比对。
      # 真碟一律走 MD_TEST_MEDIA，CI 上不存在，所以这里只能靠骨架——它不含任何
      # 音频内容，正好也把「数据不足时补零」那条路径覆盖掉（CLAUDE.md 深坑 #6）。
      - name: SACD helper smoke (自造骨架，无版权内容)
        run: |
          python3 tests/fixtures/make_sacd_skeleton.py tests/fixtures/generated
          scripts/sacd-helper-drive.py \
            --iso tests/fixtures/generated/sacd-skeleton.iso \
            --track 1 --determinism | tee sacd.txt
          grep -q '✓ 确定性' sacd.txt \
            || { echo "::error::sacd-helper 的 stat/read 不可复现"; exit 1; }
          MD_SACD_STDOUT_TEST=1 scripts/sacd-helper-drive.py \
            --iso tests/fixtures/generated/sacd-skeleton.iso --track 1 > guard.txt 2>/dev/null
          grep -q 'dsf_size' guard.txt \
            || { echo "::error::stdout 保险闸失效，帧流被污染"; cat guard.txt; exit 1; }
          echo "✓ 协议 v1 冒烟通过，stdout 保险闸有效"
          # 正确性 oracle：顺序全量导出做参照件，再用全新 helper 随机存取逐段 memcmp。
          # 确定性只证明幂等，不证明正确（CLAUDE.md 深坑 #11）。骨架的音频区是全零，
          # 所以这一步在 CI 上主要验索引与定位算术，真碟的强度验证走 MD_TEST_MEDIA。
          scripts/sacd-helper-drive.py \
            --iso tests/fixtures/generated/sacd-skeleton.iso \
            --track 1 --verify-random --rounds 200 | tee rand.txt
          grep -q '✗' rand.txt && { echo "::error::随机存取与参照件不一致"; exit 1; }
          echo "✓ 随机存取与参照件逐字节一致"

      # helper 是独立进程，不该链任何 Qt / 播放栈，更不该出现解密库。
      - name: Verify sacd-helper isolation
        run: |
          otool -L build/sacd-helper
          if otool -L build/sacd-helper | grep -qiE 'Qt|libmpv|dvdcss|aacs|bdplus'; then
            echo "::error::sacd-helper 的依赖闭包里出现了不该有的东西"; exit 1
          fi
          echo "✓ sacd-helper 依赖干净"
